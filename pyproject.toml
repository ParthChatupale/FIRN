[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "firn-polar-ops"
version = "0.1.0"
description = "FIRN polar station planning API and simulation engine"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.121.1,<1",
  "psycopg[binary]>=3.2.12,<4",
  "python-dotenv>=1,<2",
  "SQLAlchemy>=2.1.1,<2.2",
  "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]
optimization = [
  "highspy>=1.10,<2",
  "ortools>=9.15,<10",
  "pyomo>=6.10,<7",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
